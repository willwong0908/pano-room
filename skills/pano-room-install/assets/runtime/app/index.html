}
function nextFrame(){
 if(frameHandle!==null||v.paused||v.ended)return;
 const tick=()=>{frameHandle=null;if(v.paused||v.ended)return;
  if(v.requestVideoFrameCallback){presentFrame()}
  else{const q=v.getVideoPlaybackQuality?.(),n=q?q.totalVideoFrames-q.droppedVideoFrames:v.currentTime;if(n!==lastFallbackFrame){lastFallbackFrame=n;presentFrame()}}
  nextFrame();
 };
 frameHandle=v.requestVideoFrameCallback?v.requestVideoFrameCallback(tick):requestAnimationFrame(tick);
}
v.onloadedmetadata=()=>{uploadPath='probe';textureReady=false;lastFallbackFrame=null;el('seek').max=v.duration;el('total').textContent=stamp(v.duration)};
v.onloadeddata=presentFrame;v.onseeked=presentFrame;v.addEventListener('waiting',()=>{if(v.getAttribute('src')&&!v.paused)el('err').textContent='正在缓冲视频…'});v.addEventListener('canplay',()=>{if(el('err').textContent==='正在缓冲视频…')el('err').textContent=''});v.onplay=()=>{el('play').innerHTML=ICONS.pause;el('play').ariaLabel='暂停';nextFrame()};v.onpause=()=>{if(frameHandle!==null){if(v.cancelVideoFrameCallback)v.cancelVideoFrameCallback(frameHandle);else cancelAnimationFrame(frameHandle);frameHandle=null}el('play').innerHTML=ICONS.play;el('play').ariaLabel='播放'};
new ResizeObserver(draw).observe(c);v.onerror=()=>fail('当前浏览器无法解码此原画视频，请使用支持该视频编码的浏览器。');
el('play').onclick=()=>v.paused?v.play().catch(()=>fail('播放失败，请重新打开预览。')):v.pause();
v.ontimeupdate=()=>{el('seek').value=v.currentTime;el('seek').style.setProperty('--pct',(v.currentTime/v.duration*100)+'%');el('elapsed').textContent=stamp(v.currentTime)};el('seek').oninput=e=>v.currentTime=Number(e.target.value);
c.onpointerdown=e=>{point=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!point)return;yaw-=(e.clientX-point[0])*.004;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-point[1])*.004));point=[e.clientX,e.clientY];draw()};c.onlostpointercapture=()=>point=null;c.onkeydown=e=>{const delta={ArrowLeft:[-.08,0],ArrowRight:[.08,0],ArrowUp:[0,.08],ArrowDown:[0,-.08]}[e.key];if(delta){e.preventDefault();yaw+=delta[0];pitch=Math.max(-1.4,Math.min(1.4,pitch+delta[1]));draw()}};
el('reset').onclick=()=>{yaw=-2.35;pitch=.06;draw()};
const stage=el('stage');
function expanded(value){stage.classList.toggle('expanded',value);document.body.style.overflow=value?'hidden':'';el('full').setAttribute('aria-label',value?'退出全屏':'全屏');el('full').title=value?'退出全屏':'全屏';draw()}
el('full').onclick=async()=>{if(stage.classList.contains('expanded')){expanded(false);return}if(document.fullscreenElement){await document.exitFullscreen();return}if(document.fullscreenEnabled&&stage.requestFullscreen){try{await stage.requestFullscreen();return}catch(e){}}expanded(true)};
document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;el('full').setAttribute('aria-label',active?'退出全屏':'全屏');el('full').title=active?'退出全屏':'全屏';draw()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('expanded'))expanded(false)});draw();
}

let folder='全部视频';
let ITEMS=[];
let selection=0;
let selectedId=null;
const stamp=s=>s===null?'—:—':Math.floor((s||0)/60)+':'+String(Math.floor((s||0)%60)).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,options){const r=await fetch(url,options);const j=await r.json();if(!r.ok)throw Error(j.message||'请求失败');return j}
function render(){
 const q=el('search').value.toLowerCase();
 let list=ITEMS.filter(x=>(folder==='全部视频'||x.folder===folder)&&(x.title+x.filename).toLowerCase().includes(q));
 const sort=el('sort').value;
 if(sort==='name')list.sort((a,b)=>a.filename.localeCompare(b.filename));
 if(sort==='duration')list.sort((a,b)=>b.seconds-a.seconds);
 el('count').textContent=list.length+' 项';
 el('rows').innerHTML=list.map(x=>'<button class="row" data-item="'+x.id+'"><span class="name"><img src="'+x.thumb+'" alt="" loading="lazy"><span><strong>'+esc(x.title)+'</strong><small><span class="desktop">'+esc(x.filename)+(x.width?' · '+x.width+'×'+x.height:'')+'</span><span class="mobile">'+stamp(x.seconds)+' · '+esc(x.format)+' · '+x.size+'</span></small></span></span><span class="cell">'+esc(x.date)+'</span><span class="cell">'+stamp(x.seconds)+'</span><span class="cell">'+x.size+'</span>'+ICONS.chevron+'</button>').join('')||'<div class="empty">'+(q?'没有找到匹配的视频':'此目录还没有全景视频')+'</div>';
 document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openVideo(b.dataset.item));
 document.querySelectorAll('.row img').forEach(img=>img.onerror=()=>{img.style.visibility='hidden'});
}
function selectFolder(name){folder=name;el('title').textContent=name;el('breadcrumb').textContent=name==='全部视频'?'':' / '+name;el('folders').hidden=name!=='全部视频';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.folder===name));render()}
async function loadLibrary(){
 try{
  const j=await request('/api/library');
  ITEMS=j.items.map(x=>({...x,size:(x.bytes/1048576).toFixed(1)+' MB'}));
  const folders=[...new Set(ITEMS.map(x=>x.folder))].sort();
  const counts=name=>ITEMS.filter(x=>x.folder===name).length;
  const rail=document.querySelector('.rail');
  rail.innerHTML='<div class="brand">'+ICONS.logo+'环映</div><label>片库</label><button class="nav" data-folder="全部视频">'+ICONS.grid+'全部视频<small>'+ITEMS.length+'</small></button><label>文件夹</label>'+folders.map(f=>'<button class="nav" data-folder="'+esc(f)+'">'+ICONS.folder+esc(f)+'<small>'+counts(f)+'</small></button>').join('');
  el('folders').innerHTML=folders.map(f=>'<button class="cover" data-folder="'+esc(f)+'"><img src="'+ITEMS.find(x=>x.folder===f).thumb+'" alt=""><div><strong>'+esc(f)+'</strong><small>'+counts(f)+' 段视频</small></div>'+ICONS.chevron+'</button>').join('');
  document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>selectFolder(b.dataset.folder));
  if(folder!=='全部视频'&&!folders.includes(folder))folder='全部视频';
  selectFolder(folder);
 }catch(e){el('rows').textContent=e.message}
}
el('home').onclick=()=>{selectFolder('全部视频');loadLibrary()};
el('search').oninput=render;el('sort').onchange=render;
async function openVideo(id){
 const x=ITEMS.find(x=>x.id===id);if(!x)return;
 const serial=++selection;selectedId=id;
 el('library').hidden=true;el('player').hidden=false;
 el('playingtitle').textContent=x.title;el('playingdetail').textContent=x.date+' · '+x.format+' · '+x.size+(x.width?' · '+x.width+'×'+x.height:'')+(x.hdr?' · 源HDR':'');el('filename').textContent=x.filename;
 v.pause();v.removeAttribute('src');v.load();el('seek').value=0;el('seek').style.setProperty('--pct','0%');el('elapsed').textContent='0:00';el('total').textContent=stamp(x.seconds);
 el('err').textContent='正在打开原画视频…';window.scrollTo(0,0);location.hash='play-'+id;
 try{
  const state=await request('/api/prepare?id='+encodeURIComponent(id),{method:'POST'});
  if(serial!==selection)return;
  const limit=g?g.getParameter(g.MAX_TEXTURE_SIZE):0;
  if(limit&&Math.max(state.width,state.height)>limit)throw Error('当前设备的全景纹理上限为 '+limit+' 像素，无法显示这段原画视频。');
  v.addEventListener('loadedmetadata',()=>{if(serial===selection)v.currentTime=.04},{once:true});
  el('playingdetail').textContent=x.date+' · '+x.format+' · '+x.size+' · 原画 '+state.width+'×'+state.height+(state.hdr?' · 源HDR':'');
  el('err').textContent='';v.src=state.url;v.load();
 }catch(e){if(serial===selection)el('err').textContent=e.message}
}
el('return').onclick=()=>{
 selection++;selectedId=null;v.pause();el('player').hidden=true;el('library').hidden=false;history.replaceState(null,'',location.pathname);loadLibrary()
};
window.onhashchange=()=>{if(!location.hash)el('return').click()};
el('play').onclick=()=>{if(!v.getAttribute('src'))return;if(v.paused)v.play().catch(()=>el('err').textContent='播放失败，请刷新后重试。');else v.pause()};
loadLibrary();
setInterval(()=>{if(!el('library').hidden&&!folderDialog.open)loadLibrary()},30000);
let folderSettings, browseRoot='', browsePath='';
const folderDialog=el('folder-dialog');
el('manage-folders').onclick=async()=>{
 folderDialog.showModal();
 el('folder-error').textContent='';
 try{await showFolderSettings()}catch(e){el('folder-error').textContent=e.message}
};
el('close-folders').onclick=()=>folderDialog.close();
folderDialog.addEventListener('click',e=>{if(e.target===folderDialog)folderDialog.close()});
async function showFolderSettings(){
 folderSettings=await request('/api/folders');
 el('manage-view').hidden=false;el('browse-view').hidden=true;
 el('selected-folders').replaceChildren();
 for(const entry of folderSettings.folders){
  const row=document.createElement('div');row.className='selected-folder';
  const details=document.createElement('div');
  const title=document.createElement('strong');title.textContent=entry.name;
  const path=document.createElement('small');
  path.textContent=(folderSettings.roots.find(r=>r.id===entry.root)?.name||'未挂载的存储空间')+' / '+entry.path;
  details.append(title,path);
  const remove=document.createElement('button');remove.className='remove-folder';remove.textContent='移出片库';
  remove.onclick=async()=>{remove.disabled=true;el('folder-error').textContent='';try{await request('/api/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'remove',root:entry.root,path:entry.path})});await showFolderSettings();loadLibrary()}catch(e){el('folder-error').textContent=e.message;remove.disabled=false}};
  row.append(details,remove);el('selected-folders').append(row);
 }
 if(!folderSettings.folders.length)el('selected-folders').textContent='还没有添加影片文件夹。';
}
el('add-folder').onclick=()=>{
 el('manage-view').hidden=true;el('browse-view').hidden=false;
 browseRoot='';browsePath='';showRoots()
};
function showRoots(){
 el('browse-location').textContent='选择存储空间';el('add-current').hidden=true;el('up-folder').hidden=true;el('directory-list').replaceChildren();
 for(const root of folderSettings.roots){
  const button=document.createElement('button');button.className='directory-row';button.innerHTML=ICONS.folder+'<span></span>'+ICONS.chevron;button.querySelector('span').textContent=root.name;
  button.onclick=()=>browseFolder(root.id,'');el('directory-list').append(button);
 }
}
async function browseFolder(root,path){
 el('folder-error').textContent='';
 el('directory-list').textContent='正在读取文件夹…';el('add-current').disabled=true;
 try{
  const result=await request('/api/directories?root='+encodeURIComponent(root)+'&path='+encodeURIComponent(path));
  browseRoot=root;browsePath=result.path;
  el('browse-location').textContent=folderSettings.roots.find(r=>r.id===root).name+(browsePath?' / '+browsePath:'');
  el('up-folder').hidden=false;el('add-current').hidden=false;el('add-current').disabled=false;
  el('directory-list').replaceChildren();
  for(const entry of result.directories){
   const button=document.createElement('button');button.className='directory-row';button.innerHTML=ICONS.folder+'<span></span>'+ICONS.chevron;button.querySelector('span').textContent=entry.name;button.onclick=()=>browseFolder(root,entry.path);el('directory-list').append(button);
  }
  if(!result.directories.length)el('directory-list').innerHTML='<p class="directory-empty">此文件夹没有子文件夹，可以直接添加。</p>';
 }catch(e){el('folder-error').textContent=e.message}
}
el('up-folder').onclick=()=>browsePath?browseFolder(browseRoot,browsePath.split('/').slice(0,-1).join('/')):showRoots();
el('back-settings').onclick=()=>showFolderSettings().catch(e=>el('folder-error').textContent=e.message);
el('add-current').onclick=async()=>{
 el('add-current').disabled=true;el('folder-error').textContent='';
 try{
  await request('/api/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',root:browseRoot,path:browsePath})});
  await showFolderSettings();loadLibrary();
 }catch(e){el('folder-error').textContent=e.message}
 finally{el('add-current').disabled=false}
};
</script></html>
