// 探测当前部署的局域网入口，失败时沿用打开页面时的代理通道。
async function preferLanConnection() {
 const controller = new AbortController();
 const timeout = setTimeout(() => controller.abort(), 2500);
 try {
  const options = {signal: controller.signal, cache: 'no-store', credentials: 'omit'};
  const configResponse = await fetch('/api/connection', options);
  if (!configResponse.ok) return;
  const config = await configResponse.json();
  const target = new URL(config.lan_url);
  if (location.origin === target.origin) return;
  const probeResponse = await fetch(target.origin + '/api/lan', options);
  if (!probeResponse.ok) return;
  const probe = await probeResponse.json();
  if (probe.instance_id !== config.instance_id) return;
  target.hash = location.hash;
  target.search = location.search;
  location.replace(target.href);
 } catch (error) {
  // 内网不可达、超时或系统限制探测时，当前入口继续工作。
 } finally {
  clearTimeout(timeout);
 }
}

  await this.ready;
  if(this.closed||!this.db)throw Error('存储不可用');
  if(this.saved.has(url)){
   const blob=await this.storage(url);
   if(blob)return blob;
   this.saved.delete(url);
  }
  if(this.reason||this.closed)throw Error('预载已停止');
  let item=this.pending.get(url);
  if(!item){
   const xhr=new XMLHttpRequest();item={xhr,needed:foreground};
   this.pending.set(url,item);
   item.promise=(async()=>{
    const blob=await new Promise((resolve,reject)=>{
     xhr.open('GET',url);xhr.responseType='blob';xhr.timeout=35000;
     let seen=0;
     xhr.onprogress=e=>{this.bytes+=e.loaded-seen;seen=e.loaded};
     xhr.onload=()=>xhr.status===200&&xhr.response.size?resolve(xhr.response):reject(Error('读取分段失败'));
     xhr.onabort=()=>reject(new DOMException('下载取消','AbortError'));
     xhr.onerror=xhr.ontimeout=()=>reject(Error('分段下载中断'));
     xhr.send();
    });
    if(!this.closed){
     try{
      if(this.binaryStorage) await this.storage(url,await blob.arrayBuffer());
      else {
       try{await this.storage(url,blob)}
       catch(error){
        if(this.closed || error.name==='QuotaExceededError')throw error;
        // Some WebKit stores accept ArrayBuffer but reject Blob values.
        this.binaryStorage=true;
        await this.storage(url,await blob.arrayBuffer());
       }
      }
      this.saved.add(url);
     } catch(error){this.storageError=String(error);if(!this.closed)this.disable('本地空间不足或不可写')}
    }
    return blob;
   })().finally(()=>this.pending.delete(url));
  }
  if(foreground)item.needed=true;
  return item.promise;
 }
 async pump(){
  await this.ready;
  if(this.running||this.closed||this.reason||!this.urls.length)return;
  this.running=true;
  try{
   while(!this.closed&&!this.reason&&this.saved.size<this.urls.length){
    // Seeked-to and subsequent fragments come first. Fill skipped gaps last.
    let i=this.position;
    while(i<this.urls.length&&this.saved.has(this.urls[i]))i++;
    if(i===this.urls.length)i=this.urls.findIndex(url=>!this.saved.has(url));
    if(i<0)break;
    const url=this.urls[i];this.background=url;
    try{await this.get(url,false)}catch(error){
     if(this.closed)break;
     if(error.name!=='AbortError'){this.disable('预读中断');break}
    }
   }
  }finally{this.background=null;this.running=false;this.show()}
 }
 close(){
  if(this.closed)return;
  this.closed=true;clearInterval(this.timer);
  for(const p of this.pending.values())p.xhr.abort();
  this.db?.close();
  discardMovieDB(this.key);
  this.label.textContent='';
 }
 loader(Base){
  const cache=this;
  return class extends Base {
   load(ctx,config,cb){
    if(!Number.isInteger(ctx.frag.sn))return super.load(ctx,config,cb);
    this.waiting={ctx,cb};const start=performance.now();
    cache.get(ctx.url,true).then(blob=>this.waiting?(blob instanceof ArrayBuffer?blob:blob.arrayBuffer()):null).then(data=>{
     if(!this.waiting||!data)return;
     this.waiting=null;const stats=this.stats;
     stats.loading.start=start;stats.loading.first=start;stats.loading.end=performance.now();
     stats.loaded=stats.total=data.byteLength;
     stats.bwEstimate=8000*stats.loaded/Math.max(1,stats.loading.end-start);
     cb.onProgress?.(stats,ctx,data,null);
     cb.onSuccess({url:ctx.url,data,code:200},stats,ctx,null);
    }).catch(()=>{if(this.waiting){this.waiting=null;super.load(ctx,config,cb)}});
   }
   abort(){
    const q=this.waiting;this.waiting=null;
    if(q){this.stats.aborted=true;q.cb.onAbort?.(this.stats,q.ctx,null)}else super.abort();
   }
   destroy(){this.waiting=null;super.destroy()}
  };
 }
}

let streamer, loadingTimer, lastSpeed, moviePreload;
v.addEventListener('seeking',()=>moviePreload?.seek(v.currentTime));
v.addEventListener('playing',()=>moviePreload?.pump());
window.addEventListener('pagehide',()=>{if(moviePreload)releaseStream()});
window.addEventListener('pageshow',e=>{if(e.persisted&&selectedId)openVideo(selectedId)});

let scrubbing = false;
function releaseStream() {
 intent=false;cancelGate();edgeSample=null;policy=null;lastSpeed="";
 moviePreload?.close();moviePreload=null;
 clearInterval(loadingTimer);
 if (streamer) streamer.destroy();
 el('preload-state').textContent='';
 streamer = null;
 v.removeAttribute('src');
 v.load();
}
function showSourceOption(message) {
 const status=el('err');
 status.textContent=message;
 if (!selectedId || v.currentSrc.includes('/source/')) return;
 const button=document.createElement('button');
 button.textContent='尝试原片播放';
 button.style.cssText='color:inherit;text-decoration:underline;pointer-events:auto';
 button.onclick=()=>{
  releaseStream();status.textContent='';
  v.src='/source/'+selectedId;v.load();startPlayback();
 };
 status.append(button);
}
function openStream(id, serial) {
 policy=new BufferPolicy();
 const url = '/hls/' + id + '/index.m3u8';
 v.disableRemotePlayback = true;
 if (window.Hls && Hls.isSupported()) {
  const cache=new MoviePreload(el('preload-state'));moviePreload=cache;
  const hls = new Hls({fLoader:cache.loader(Hls.DefaultConfig.loader),maxBufferLength:4, maxMaxBufferLength:30, maxBufferSize:96*1024*1024,
    backBufferLength:2, startFragPrefetch:true, testBandwidth:false, enableWorker:true});
  streamer = hls;
  hls.on(Hls.Events.LEVEL_LOADED,(_,data)=>{cache.configure(data.details.fragments);if(!v.paused)cache.pump()});
  let loading = null, received = 0, last = performance.now();
  hls.on(Hls.Events.FRAG_LOADING, (_, data) => {loading = data.frag; received = 0; last = performance.now()});
  loadingTimer = setInterval(() => {
   if (!loading || serial !== selection) return;
   const now = performance.now(), bytes = loading.stats.loaded;
   const rate = Math.max(0, (bytes-received)*8/((now-last)*1000));
   lastSpeed=(cache.speed||rate).toFixed(1)+' Mb/s';
   if(v.readyState<3)el('err').textContent='正在预载 · '+lastSpeed;
   received = bytes; last = now;
  }, 500);
  hls.on(Hls.Events.FRAG_BUFFERED, (_, {frag}) => {
   if(Number.isInteger(frag.sn) && frag.duration>0) {
    policy.sample((frag.stats.buffering.end-frag.stats.loading.start)/1000,frag.duration);
    hls.config.maxBufferLength=Math.max(3,policy.target()+1);
   }
   loading = null;
   if (v.readyState >= 2) el('err').textContent = '';
   paintSeek();
  });
  hls.on(Hls.Events.ERROR, (_, data) => {
   if (!data.fatal || serial !== selection) return;
   loading = null;
   hls.destroy();streamer = null;cache.close();moviePreload=null;
   if (v.canPlayType('application/vnd.apple.mpegurl')) {
    el('preload-state').textContent='系统播放器管理预载';edgeSample={end:0,time:performance.now()};v.preload='auto';v.src = url;v.load();
   } else {
    showSourceOption('无法读取分段（' + data.details + '）。');
   }
  });
  hls.loadSource(url);
  hls.attachMedia(v);
 } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
  el('preload-state').textContent='系统播放器管理预载';edgeSample={end:0,time:performance.now()};v.preload='auto';v.src = url;v.load();
 } else {
  throw Error('此浏览器不支持分段播放。请用支持 HLS 或 Media Source 的浏览器打开。');
 }
}
function paintSeek() {
 const seek = el('seek');
 const duration = v.duration;
 if (!Number.isFinite(duration) || duration <= 0) return;
 if (!scrubbing) seek.value = v.currentTime;
 seek.max = duration;
 const pct = Math.min(100, Number(seek.value)/duration*100);
 const stops = ['white 0%', 'white '+pct+'%'];
 let end = pct;
 for (let i=0;i<v.buffered.length;i++) {
  const a = Math.max(end,v.buffered.start(i)/duration*100);
  const b = Math.min(100,v.buffered.end(i)/duration*100);
  if (b <= a) continue;
  stops.push('#ffffff38 '+end+'%', '#ffffff38 '+a+'%', '#ffffff9e '+a+'%', '#ffffff9e '+b+'%');
  end = b;
 }
 stops.push('#ffffff38 '+end+'%', '#ffffff38 100%');
 seek.style.setProperty('--track','linear-gradient(to right,'+stops.join(',')+')');
 el('elapsed').textContent=stamp(Number(seek.value));
}
el('seek').oninput=()=>{scrubbing=true;paintSeek()};
el('seek').onchange=e=>{const t=Number(e.target.value);scrubbing=false;v.currentTime=t;paintSeek()};
el('seek').onpointercancel=()=>{scrubbing=false;paintSeek()};
v.ontimeupdate=paintSeek;
v.onprogress=paintSeek;
v.addEventListener('canplay',()=>{el('err').textContent=''});
async function openVideo(id){
 const x=ITEMS.find(x=>x.id===id);if(!x)return;
 const serial=++selection;selectedId=id;
 releaseStream();scrubbing=false;el('seek').style.removeProperty('--track');
 el('library').hidden=true;el('player').hidden=false;
 el('playingtitle').textContent=x.title;el('playingdetail').textContent=x.date+' · '+x.format+' · '+x.size+(x.width?' · '+x.width+'×'+x.height:'')+(x.hdr?' · 源HDR':'');el('filename').textContent=x.filename;
 v.pause();v.removeAttribute('src');v.load();el('seek').value=0;el('seek').style.setProperty('--pct','0%');el('elapsed').textContent='0:00';el('total').textContent=stamp(x.seconds);
 el('play').disabled=true;el('err').textContent='正在打开原画视频…';window.scrollTo(0,0);location.hash='play-'+id;
 try{
  const state=await request('/api/prepare?id='+encodeURIComponent(id),{method:'POST'});
  if(serial!==selection)return;
  const limit=g?g.getParameter(g.MAX_TEXTURE_SIZE):0;
  const compatible=limit&&Math.max(state.width,state.height)>limit;

  el('playingdetail').textContent=x.date+' · '+x.format+' · '+x.size+' · 原画 '+state.width+'×'+state.height+(state.hdr?' · 源HDR':'');
  el('playingdetail').textContent += compatible?' · 兼容显示 '+Math.floor(state.width*limit/Math.max(state.width,state.height))+'×'+Math.floor(state.height*limit/Math.max(state.width,state.height)):' · 分段原画';
  el('err').textContent = '正在读取首段…';
  openStream(id, serial);el('play').disabled=false;
 }catch(e){if(serial===selection)el('err').textContent=e.message}
}
el('return').onclick=()=>{
 selection++;selectedId=null;v.pause();

 releaseStream();el('player').hidden=true;el('library').hidden=false;history.replaceState(null,'',location.pathname);loadLibrary()
};
window.onhashchange=()=>{if(!location.hash)el('return').click()};
el('play').onclick=()=>{
 if(!streamer && !v.currentSrc && !v.getAttribute('src'))return;
 if(gated || !v.paused){intent=false;cancelGate();v.pause();el('play').innerHTML=ICONS.play;el('play').ariaLabel='播放';el('err').textContent='';}
 else startPlayback();
};
loadLibrary().then(() => {
 const id = diagParams.get("id");
 if (ITEMS.some(item => item.id === id)) openVideo(id);
});
setInterval(()=>{if(!el('library').hidden&&!folderDialog.open)loadLibrary()},30000);
let folderSettings, browseRoot='', browsePath='';
const folderDialog=el('folder-dialog');
el('manage-folders').onclick=async()=>{
 folderDialog.showModal();
 el('folder-error').textContent='';
 try{await showFolderSettings()}catch(e){el('folder-error').textContent=e.message}
};
el('close-folders').onclick=()=>folderDialog.close();
folderDialog.addEventListener('click',e=>{if(e.target===folderDialog)folderDialog.close()});
async function showFolderSettings(){
 folderSettings=await request('/api/folders');
 el('manage-view').hidden=false;el('browse-view').hidden=true;
 el('selected-folders').replaceChildren();
 for(const entry of folderSettings.folders){
  const row=document.createElement('div');row.className='selected-folder';
  const details=document.createElement('div');
  const title=document.createElement('strong');title.textContent=entry.name;
  const path=document.createElement('small');
  path.textContent=(folderSettings.roots.find(r=>r.id===entry.root)?.name||'未挂载的存储空间')+' / '+entry.path;
  details.append(title,path);
  const remove=document.createElement('button');remove.className='remove-folder';remove.textContent='移出片库';
  remove.onclick=async()=>{remove.disabled=true;el('folder-error').textContent='';try{await request('/api/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'remove',root:entry.root,path:entry.path})});await showFolderSettings();loadLibrary()}catch(e){el('folder-error').textContent=e.message;remove.disabled=false}};
  row.append(details,remove);el('selected-folders').append(row);
 }
 if(!folderSettings.folders.length)el('selected-folders').textContent='还没有添加影片文件夹。';
}
el('add-folder').onclick=()=>{
 el('manage-view').hidden=true;el('browse-view').hidden=false;
 browseRoot='';browsePath='';showRoots()
};
function showRoots(){
 el('browse-location').textContent='选择存储空间';el('add-current').hidden=true;el('up-folder').hidden=true;el('directory-list').replaceChildren();
 for(const root of folderSettings.roots){
  const button=document.createElement('button');button.className='directory-row';button.innerHTML=ICONS.folder+'<span></span>'+ICONS.chevron;button.querySelector('span').textContent=root.name;
  button.onclick=()=>browseFolder(root.id,'');el('directory-list').append(button);
 }
}
async function browseFolder(root,path){
 el('folder-error').textContent='';
 el('directory-list').textContent='正在读取文件夹…';el('add-current').disabled=true;
 try{
  const result=await request('/api/directories?root='+encodeURIComponent(root)+'&path='+encodeURIComponent(path));
  browseRoot=root;browsePath=result.path;
  el('browse-location').textContent=folderSettings.roots.find(r=>r.id===root).name+(browsePath?' / '+browsePath:'');
  el('up-folder').hidden=false;el('add-current').hidden=false;el('add-current').disabled=false;
  el('directory-list').replaceChildren();
  for(const entry of result.directories){
   const button=document.createElement('button');button.className='directory-row';button.innerHTML=ICONS.folder+'<span></span>'+ICONS.chevron;button.querySelector('span').textContent=entry.name;button.onclick=()=>browseFolder(root,entry.path);el('directory-list').append(button);
  }
  if(!result.directories.length)el('directory-list').innerHTML='<p class="directory-empty">此文件夹没有子文件夹，可以直接添加。</p>';
 }catch(e){el('folder-error').textContent=e.message}
}
el('up-folder').onclick=()=>browsePath?browseFolder(browseRoot,browsePath.split('/').slice(0,-1).join('/')):showRoots();
el('back-settings').onclick=()=>showFolderSettings().catch(e=>el('folder-error').textContent=e.message);
el('add-current').onclick=async()=>{
 el('add-current').disabled=true;el('folder-error').textContent='';
 try{
  await request('/api/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',root:browseRoot,path:browsePath})});
  await showFolderSettings();loadLibrary();
 }catch(e){el('folder-error').textContent=e.message}
 finally{el('add-current').disabled=false}
};
